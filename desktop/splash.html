<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwasthRoute ERP Launcher</title>
  <style>
    :root {
      --primary: #0d9488;
      --primary-hover: #0f766e;
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-app-region: drag; /* Make the splash screen draggable */
    }

    .container {
      width: calc(100vw - 2px);
      height: calc(100vh - 2px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-sizing: border-box;
      background: linear-gradient(135deg, rgba(13, 148, 136, 0.05) 0%, rgba(0, 0, 0, 0) 100%), var(--card-bg);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .logo-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .glow-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(13, 148, 136, 0.4) 0%, rgba(13, 148, 136, 0) 70%);
      animation: pulse 2.5s infinite ease-in-out;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0d9488 0%, #10b981 100%);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 20px rgba(13, 148, 136, 0.3);
      z-index: 1;
    }

    .logo-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: white;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.025em;
    }

    h1 span {
      color: var(--primary);
    }

    .subtitle {
      margin: 6px 0 30px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .loader-container {
      width: 70%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0d9488 0%, #10b981 100%);
      border-radius: 2px;
      animation: loader 3s ease-in-out forwards;
      box-shadow: 0 0 8px rgba(13, 148, 136, 0.5);
    }

    .loading-status {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      animation: textPulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.8;
      }
    }

    @keyframes textPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes loader {
      0% { width: 0%; }
      30% { width: 45%; }
      60% { width: 75%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="glow-ring"></div>
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <!-- Medical building icon -->
          <path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4M10 9h4M12 7v4"/>
        </svg>
      </div>
    </div>
    
    <h1>Swasth<span>Route</span></h1>
    <div class="subtitle">Pharmacy ERP Desktop</div>

    <div class="loader-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="loading-status">Connecting to ERP local server...</div>
    </div>
  </div>
</body>
</html>
