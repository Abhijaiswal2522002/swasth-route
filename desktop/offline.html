<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Lost - SwasthRoute ERP</title>
  <style>
    :root {
      --primary: #d97706;
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .container {
      width: calc(100vw - 2px);
      height: calc(100vh - 2px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-sizing: border-box;
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.05) 0%, rgba(0, 0, 0, 0) 100%), var(--card-bg);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 40px;
      text-align: center;
    }

    .icon-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .glow-ring {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.3) 0%, rgba(217, 119, 6, 0) 70%);
      animation: pulse 2s infinite ease-in-out;
    }

    .warning-icon {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 20px rgba(217, 119, 6, 0.2);
      z-index: 1;
    }

    .warning-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: white;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.025em;
    }

    p {
      margin: 12px 0 30px;
      font-size: 13px;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.6;
    }

    .btn-retry {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
    }

    .btn-retry:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
    }

    .reconnect-status {
      font-size: 10px;
      font-weight: 600;
      color: #9ca3af;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-loader {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--primary);
      animation: bounce 1.4s infinite ease-in-out both;
    }
    
    .dot-loader:nth-child(2) { animation-delay: -0.32s; }
    .dot-loader:nth-child(3) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <div class="glow-ring"></div>
      <div class="warning-icon">
        <svg viewBox="0 0 24 24">
          <path d="M1 21h22L12 2 1 21z"/>
          <path d="M12 9v4M12 17h.01"/>
        </svg>
      </div>
    </div>
    
    <h1>Connection Lost</h1>
    <p>SwasthRoute ERP requires an active internet connection to sync inventory, manage sales, and process transactions.</p>

    <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>

    <div class="reconnect-status">
      <span class="dot-loader"></span>
      <span class="dot-loader"></span>
      <span class="dot-loader"></span>
      <span>Attempting to reconnect...</span>
    </div>
  </div>
</body>
</html>
